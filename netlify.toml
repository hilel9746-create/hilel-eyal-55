[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Report-Only first so inline scripts in Calculator.html keep working while
    # you verify nothing breaks. Switch to "Content-Security-Policy" once clean.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://api.resend.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[edge_functions]]
  function = "calculator-auth"
  path = "/Calculator.html"

[[edge_functions]]
  function = "calculator-auth"
  path = "/Calculator"

[[edge_functions]]
  function = "calculator-auth"
  path = "/calculator"

# Block internal/non-public files from being served (publish = "." exposes the
# whole repo root, incl. docs/ and scripts/). Return 404 instead.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/Calculator"
  to = "/Calculator.html"
  status = 200

[[redirects]]
  from = "/calculator"
  to = "/Calculator.html"
  status = 200
